name: gamyam
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  dio: ^5.9.2
  floating: ^6.0.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_foreground_task: ^9.2.2
  flutter_local_notifications: ^18.0.1
  flutter_map: ^8.3.0
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.2
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  latlong2: ^0.9.1
  live_activities: ^2.4.9
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  flutter_launcher_icons: ^0.14.4

# App icon generation (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/icon/logo.png"          # iOS + Android legacy (badge on white)
  android: true
  ios: true
  remove_alpha_ios: true                        # iOS icons must be opaque
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"           # Android 8+ adaptive
  adaptive_icon_foreground: "assets/icon/logo_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  # Bundle ONLY runtime assets. logo.png / logo_foreground.png are launcher-icon
  # SOURCES (used by flutter_launcher_icons at build time, read from disk) — they
  # must NOT be bundled (~1.9 MB of dead weight). bus.svg is unused.
  assets:
    - .env
    - assets/icon/bus-top.png
